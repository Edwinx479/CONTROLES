<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827"><title>Cuestionario – Capítulo V: Certificados Digitales y Autenticación</title>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#1e293b;--line:#3b4a5e;--text:#f3f6fc;--muted:#bac6d8;--blue:#3b82f6;--green:#22c55e;--red:#ef6464}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#1c2a42 0,#101827 65%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(100%,590px);background:var(--card);border:1px solid #29364a;border-radius:22px;padding:30px;box-shadow:0 20px 55px #0005}.hidden{display:none!important}h1{text-align:center;font-size:clamp(1.65rem,5vw,2.15rem);margin:0 0 12px}h2{font-size:1.45rem;line-height:1.4;margin:20px 0 26px}.intro,.sub{text-align:center;color:var(--muted);font-size:1.1rem;line-height:1.6}.label{display:block;font-weight:650;margin:30px 0 16px}.range{width:100%;accent-color:var(--blue)}.count{font-size:1.25rem;text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px;margin:24px 0}.btn{width:100%;border:0;border-radius:13px;background:var(--blue);color:#071528;padding:16px;font:inherit;font-size:1.12rem;font-weight:650;cursor:pointer}.btn:hover{filter:brightness(1.08)}.meta{color:var(--muted);font-size:1.08rem}.track{height:12px;border-radius:99px;background:#34445c;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:0;background:var(--blue);transition:width .2s}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:15px;padding:13px 16px;font:inherit;font-size:1.08rem;cursor:pointer}.answer:hover:not(:disabled){border-color:#71829a;background:#ffffff08}.letter{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#34445c;font-weight:700}.answer.correct{border-color:#4ade80;background:#14532d;color:#dcfce7}.answer.wrong{border-color:#f87171;background:#7f1d1d;color:#fee2e2}.feedback{min-height:30px;text-align:center;color:#fca5a5;font-weight:650;line-height:1.55;margin:18px 0}.feedback.good{color:#86efac}.result{text-align:center}.score{font-size:3.4rem;font-weight:800;margin:18px 0 4px;color:#93c5fd}.result p{color:var(--muted);font-size:1.1rem}.result-actions{display:grid;gap:12px;margin-top:26px}.secondary{background:#334155;color:var(--text)}@media(max-width:480px){body{padding:16px}.card{padding:22px 18px;border-radius:19px}.answer{font-size:1rem}.letter{width:34px;height:34px}}
</style></head><body>
<main class="card" id="setup"><h1>Cuestionario – Capítulo V</h1><p class="intro">Certificados Digitales y Autenticación</p><label class="label" for="amount">Número de preguntas</label><input class="range" id="amount" type="range" min="1" max="40" value="40"><div class="count" id="amountText">40</div><button class="btn" id="start">Comenzar</button></main>
<main class="card hidden" id="quiz"><div class="meta" id="progressText"></div><div class="track"><div class="fill" id="progress"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn hidden" id="next">Siguiente</button></main>
<main class="card result hidden" id="result"><h1>¡Cuestionario terminado!</h1><div class="score" id="score"></div><p id="scoreDetail"></p><p id="message"></p><div class="result-actions"><button class="btn" id="again">Intentar de nuevo</button><button class="btn secondary" id="home">Cambiar cantidad</button></div></main>
<script>
const questions = [["¿Qué entidad emite y firma los certificados digitales?",["Autoridad de Registro","Autoridad de Certificación","Proveedor de Internet","Servidor de aplicaciones"],1],["¿Qué recomendación estandariza la estructura de los certificados digitales?",["Estándar ISO 27001","Recomendación X.509 internacional","Protocolo TLS seguro","Algoritmo RSA asimétrico"],1],["¿Cuál es el propósito fundamental de un certificado digital?",["Almacenar contraseñas secretas","Comprimir mensajes electrónicos","Vincular identidades verificables","Acelerar conexiones seguras"],2],["¿Qué nivel de certificado exige una verificación exhaustiva de identidad?",["Validación de dominio","Validación de organización","Firma de código","Validación extendida EV"],3],["¿Qué función cumplen los protocolos SSL/TLS en las comunicaciones web?",["Proteger comunicaciones transmitidas","Registrar dominios públicos","Emitir certificados digitales","Revocar certificados comprometidos"],0],["¿Qué componente de PKI verifica la identidad de quienes solicitan certificados?",["Autoridad de Certificación","Lista de Revocación","Autoridad de Registro","Protocolo de Estado"],2],["¿Qué información recoge una CRL?",["Certificados todavía vigentes","Certificados previamente revocados","Solicitudes todavía pendientes","Certificados recientemente emitidos"],1],["¿Qué mecanismo consulta el estado de un certificado en tiempo real?",["Protocolo HTTPS seguro","Lista CRL periódica","Estándar X.509 internacional","Protocolo OCSP online"],3],["¿Qué certificado permite verificar que un programa distribuido no ha sido manipulado?",["Firma de código","Validación de dominio","Validación de organización","Validación extendida EV"],0],["¿Qué avance tecnológico amenaza a algoritmos asimétricos como RSA?",["Redes inalámbricas modernas","Almacenamiento distribuido seguro","Computación cuántica futura","Procesamiento gráfico paralelo"],2],["¿Qué beneficio principal ofrecen los certificados digitales respecto de una entidad?",["Mayor velocidad computacional","Verificación de identidad","Reducción de tráfico","Compresión de mensajes"],1],["¿Qué clave se emplea para verificar la firma digital de la CA emisora?",["Clave pública emisora","Clave privada solicitante","Clave simétrica compartida","Clave pública solicitante"],0],["¿Qué consecuencia tiene un certificado que ha superado su fecha de vencimiento?",["Renovación siempre automática","Revocación siempre automática","Autenticación permanentemente garantizada","Validez temporal finalizada"],3],["¿Qué tipo de certificado presenta normalmente un servidor web al establecer HTTPS?",["Certificado de software","Certificado de usuario","Certificado de servidor","Certificado de registro"],2],["¿Qué entidad firma los certificados para respaldar su autenticidad?",["Autoridad de Certificación","Autoridad de Registro","Proveedor de Internet","Servidor de nombres"],0],["¿Qué estándar se menciona como base estructural de los certificados en PKI?",["Protocolo OCSP online","Recomendación X.509 internacional","Algoritmo AES simétrico","Protocolo HTTPS seguro"],1],["¿Qué protocolo sucede a SSL en la protección de comunicaciones?",["Protocolo HTTP convencional","Protocolo FTP tradicional","Protocolo SMTP electrónico","Protocolo TLS seguro"],3],["¿En qué técnica criptográfica se basa el par de claves asociado a un certificado?",["Criptografía asimétrica pública","Criptografía simétrica compartida","Transposición de caracteres","Sustitución de alfabetos"],0],["¿Qué combinación identifica información presente en un certificado digital?",["Contraseña y secreto","Clave privada personal","Identidad y emisor","Contador y bloque"],2],["¿Qué protocolo se utiliza para establecer comunicaciones web seguras con certificados?",["Protocolo HTTP convencional","Protocolo HTTPS seguro","Protocolo FTP tradicional","Protocolo SMTP electrónico"],1],["¿Qué clave permite comprobar la firma del certificado emitido por una CA?",["Clave privada cliente","Clave simétrica sesión","Clave pública propietario","Clave pública emisora"],3],["¿Qué sucede con un certificado que una CA ha revocado?",["Pierde su validez","Renueva su vigencia","Amplía su duración","Conserva su confianza"],0],["¿Qué clave protege normalmente los datos de la sesión una vez establecida una conexión HTTPS?",["Clave pública emisora","Clave privada solicitante","Clave simétrica sesión","Clave pública propietario"],2],["¿Qué propiedades respalda la firma digital incorporada al certificado?",["Disponibilidad y rendimiento","Autenticidad e integridad","Velocidad y compresión","Anonimato y almacenamiento"],1],["¿Qué certificado se utiliza para identificar un servidor durante la autenticación?",["Certificado de servidor","Certificado de software","Certificado de usuario","Certificado de registro"],0],["¿Qué función corresponde a una infraestructura de clave pública?",["Comprimir mensajes cifrados","Optimizar redes físicas","Almacenar contraseñas personales","Gestionar certificados digitales"],3],["¿Qué recurso publica certificados revocados antes de su vencimiento?",["Solicitud CSR enviada","Lista CRL publicada","Clave privada emisora","Certificado DV emitido"],1],["¿Qué información permite distinguir a la entidad que emitió un certificado?",["Clave simétrica sesión","Contraseña del solicitante","Datos del emisor","Dirección IP temporal"],2],["¿Qué clave utiliza la CA para firmar digitalmente un certificado?",["Clave privada emisora","Clave pública emisora","Clave privada solicitante","Clave pública solicitante"],0],["¿Qué aplicación citada en la teoría utiliza certificados para proteger la comunicación electrónica?",["Compresión de archivos","Administración de procesos","Edición de imágenes","Correo electrónico seguro"],3],["¿Qué documento envía un solicitante a una CA para pedir un certificado?",["Lista CRL actualizada","Solicitud CSR firmable","Clave privada emisora","Respuesta OCSP vigente"],1],["¿Qué elemento de un certificado permite conocer su periodo de vigencia?",["Clave pública asociada","Identidad del emisor","Fechas de validez","Firma digital emisora"],2],["¿Qué tipo de validación comprueba principalmente el control sobre un dominio?",["Validación de dominio","Validación de organización","Validación extendida EV","Firma de código"],0],["¿Qué validación verifica también la identidad de la organización solicitante?",["Validación de dominio","Firma de código","Validación extendida EV","Validación de organización"],3],["¿Qué método permite consultar el estado de un certificado sin descargar toda una CRL?",["Consulta DNS convencional","Consulta OCSP directa","Transferencia FTP tradicional","Conexión HTTP convencional"],1],["¿Qué situación puede justificar la revocación anticipada de un certificado?",["Renovación del navegador","Actualización del servidor","Clave privada comprometida","Cambio de resolución"],2],["¿Qué información se envía al navegador cuando un servidor inicia una conexión HTTPS?",["Certificado digital servidor","Clave privada servidor","Contraseña del usuario","Clave privada emisora"],0],["¿Qué propiedad permite detectar alteraciones en la información transmitida?",["Disponibilidad del servicio","Velocidad de transferencia","Confidencialidad del usuario","Integridad de datos"],3],["¿Qué consecuencia tiene el compromiso de una Autoridad de Certificación?",["Aumenta confianza general","Compromete certificados emitidos","Elimina claves públicas","Impide cifrado simétrico"],1],["¿Qué enfoque criptográfico se investiga para enfrentar amenazas de computadoras cuánticas?",["Criptografía clásica monoalfabética","Criptografía simétrica antigua","Criptografía post cuántica","Criptografía por transposición"],2]];
let game=[],index=0,correct=0,gradedCount=0,currentAnswers=[];const $=id=>document.getElementById(id);const screens=[$('setup'),$('quiz'),$('result')];function show(el){screens.forEach(s=>s.classList.add('hidden'));el.classList.remove('hidden')}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('amount').oninput=()=> $('amountText').textContent=$('amount').value;
$('start').onclick=()=>{game=shuffle([...questions]).slice(0,+$('amount').value);index=0;correct=0;gradedCount=game.filter(q=>q[2]!==null).length;show($('quiz'));render()};
function render(){const q=game[index];$('progressText').textContent=`Pregunta ${index+1} de ${game.length}`;$('progress').style.width=`${index/game.length*100}%`;$('question').textContent=q[0];$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('answers').innerHTML='';currentAnswers=shuffle(q[1].map((text,originalIndex)=>({text,isCorrect:originalIndex===q[2]})));currentAnswers.forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;b.querySelector('span:last-child').textContent=answer.text;b.onclick=()=>choose(i);$('answers').appendChild(b)})}
function choose(choice){const q=game[index],buttons=[...$('answers').children],f=$('feedback'),correctIndex=currentAnswers.findIndex(answer=>answer.isCorrect);buttons.forEach((b,i)=>{b.disabled=true;if(correctIndex>=0&&i===correctIndex)b.classList.add('correct');if(i===choice&&choice!==correctIndex)b.classList.add('wrong')});if(correctIndex<0){f.textContent='Esta pregunta no tiene una opción correcta entre las respuestas proporcionadas y no se contará en la calificación.'}else if(choice===correctIndex){correct++;f.textContent='¡Correcto!';f.classList.add('good')}else f.textContent=`Respuesta correcta: ${currentAnswers[correctIndex].text}`;$('next').textContent=index===game.length-1?'Ver calificación':'Siguiente';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<game.length)render();else finish()};function finish(){const pct=Math.round(correct/gradedCount*100);$('score').textContent=`${pct}/100`;$('scoreDetail').textContent=`Respuestas correctas: ${correct} de ${gradedCount} calificables · Incorrectas: ${gradedCount-correct} · Sin opción correcta: ${game.length-gradedCount}`;$('message').textContent=pct===100?'¡Perfecto! Todas tus respuestas son correctas.':pct>=90?'¡Excelente resultado!':pct>=70?'¡Buen trabajo! Puedes repasar las preguntas que fallaste.':'Sigue practicando: cada intento te ayudará a mejorar.';$('progress').style.width='100%';show($('result'))}$('again').onclick=()=>$('start').click();$('home').onclick=()=>show($('setup'));
</script></body></html>
