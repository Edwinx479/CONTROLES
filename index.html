<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827"><title>Cuestionario: Calidad del Software</title>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#1e293b;--line:#3b4a5e;--text:#f3f6fc;--muted:#bac6d8;--blue:#3b82f6;--green:#22c55e;--red:#ef6464}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#1c2a42 0,#101827 65%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(100%,590px);background:var(--card);border:1px solid #29364a;border-radius:22px;padding:30px;box-shadow:0 20px 55px #0005}.hidden{display:none!important}h1{text-align:center;font-size:clamp(1.65rem,5vw,2.15rem);margin:0 0 12px}h2{font-size:1.45rem;line-height:1.4;margin:20px 0 26px}.intro,.sub{text-align:center;color:var(--muted);font-size:1.1rem;line-height:1.6}.label{display:block;font-weight:650;margin:30px 0 16px}.range{width:100%;accent-color:var(--blue)}.count{font-size:1.25rem;text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px;margin:24px 0}.btn{width:100%;border:0;border-radius:13px;background:var(--blue);color:#071528;padding:16px;font:inherit;font-size:1.12rem;font-weight:650;cursor:pointer}.btn:hover{filter:brightness(1.08)}.meta{color:var(--muted);font-size:1.08rem}.track{height:12px;border-radius:99px;background:#34445c;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:0;background:var(--blue);transition:width .2s}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:15px;padding:13px 16px;font:inherit;font-size:1.08rem;cursor:pointer}.answer:hover:not(:disabled){border-color:#71829a;background:#ffffff08}.letter{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#34445c;font-weight:700}.answer.correct{border-color:#4ade80;background:#14532d;color:#dcfce7}.answer.wrong{border-color:#f87171;background:#7f1d1d;color:#fee2e2}.feedback{min-height:30px;text-align:center;color:#fca5a5;font-weight:650;line-height:1.55;margin:18px 0}.feedback.good{color:#86efac}.result{text-align:center}.score{font-size:3.4rem;font-weight:800;margin:18px 0 4px;color:#93c5fd}.result p{color:var(--muted);font-size:1.1rem}.result-actions{display:grid;gap:12px;margin-top:26px}.secondary{background:#334155;color:var(--text)}@media(max-width:480px){body{padding:16px}.card{padding:22px 18px;border-radius:19px}.answer{font-size:1rem}.letter{width:34px;height:34px}}
</style></head><body>
<main class="card" id="setup"><h1>Cuestionario: Calidad del Software</h1><p class="intro">Practica sobre ISO, SPICE, CMMI y calidad de software.</p><label class="label" for="amount">Número de preguntas</label><input class="range" id="amount" type="range" min="1" max="30" value="30"><div class="count" id="amountText">30</div><button class="btn" id="start">Comenzar</button></main>
<main class="card hidden" id="quiz"><div class="meta" id="progressText"></div><div class="track"><div class="fill" id="progress"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn hidden" id="next">Siguiente</button></main>
<main class="card result hidden" id="result"><h1>¡Cuestionario terminado!</h1><div class="score" id="score"></div><p id="scoreDetail"></p><p id="message"></p><div class="result-actions"><button class="btn" id="again">Intentar de nuevo</button><button class="btn secondary" id="home">Cambiar cantidad</button></div></main>
<script>
const questions=[
["¿Cuál es la principal razón para realizar pruebas de regresión?",["Mejorar la velocidad del software","Asegurar que las modificaciones no han introducido nuevos defectos","Aumentar la usabilidad del sistema","Probar nuevas funcionalidades del software"],1],
["¿Qué tipo de pruebas se utilizan para verificar si el software cumple con los requisitos funcionales?",["Pruebas de rendimiento","Pruebas funcionales","Pruebas de seguridad","Pruebas de usabilidad"],1],
["¿Cuál de las siguientes no es una técnica de prueba no funcional?",["Pruebas de aceptación del usuario","Pruebas de seguridad","Pruebas de rendimiento","Pruebas de compatibilidad"],0],
["¿Qué herramienta es ampliamente utilizada para la automatización de pruebas en aplicaciones web?",["JIRA","Selenium","TestRail","JMeter"],1],
["¿Qué métrica mide el porcentaje de código fuente que ha sido probado mediante pruebas unitarias?",["Tasa de defectos","Cobertura de código","Tasa de fallos","Tiempo de respuesta"],1],
["¿Qué tipo de prueba garantiza que el software puede funcionar correctamente bajo diferentes cargas?",["Pruebas de seguridad","Pruebas de rendimiento","Pruebas funcionales","Pruebas de compatibilidad"],1],
["¿Cuál es el objetivo de las pruebas de aceptación del usuario (UAT)?",["Verificar que el software cumpla con los requisitos del cliente","Identificar problemas de rendimiento","Asegurar que el código sea seguro","Probar la integridad del sistema bajo carga"],0],
["¿Qué herramienta es adecuada para realizar pruebas de carga y rendimiento?",["JMeter","Selenium","TestRail","SonarQube"],0],
["¿Qué tipo de prueba no se basa en los requisitos funcionales del software?",["Pruebas de seguridad","Pruebas de unidad","Pruebas de integración","Pruebas del sistema"],0],
["¿Cuál es la métrica que mide el porcentaje de casos de prueba que han fallado en relación con los ejecutados?",["Tasa de fallos","Tasa de automatización","Tasa de defectos","Cobertura de código"],0],
["¿Cuál es el principal objetivo de las pruebas de integración?",["Probar cada unidad individualmente","Verificar la interacción entre diferentes módulos","Probar la interfaz de usuario","Asegurar la compatibilidad entre plataformas"],1],
["¿Qué métrica es esencial para evaluar la capacidad del software para resistir ataques?",["Tasa de automatización","Pruebas de seguridad","Pruebas de rendimiento","Pruebas de regresión"],1],
["¿Qué tipo de pruebas se enfoca en la facilidad de uso del software por parte de los usuarios finales?",["Pruebas de regresión","Pruebas de usabilidad","Pruebas de rendimiento","Pruebas de integración"],1],
["¿Qué pruebas se realizan para verificar que el software cumple con las expectativas del cliente?",["Pruebas funcionales","Pruebas de aceptación del usuario (UAT)","Pruebas de seguridad","Pruebas de carga"],1],
["¿Qué tipo de pruebas se utilizan para verificar que el software sea compatible con diferentes sistemas operativos?",["Pruebas de usabilidad","Pruebas de compatibilidad","Pruebas de rendimiento","Pruebas unitarias"],1],
["¿Qué métrica es utilizada para medir el tiempo que tarda el sistema en responder a una solicitud?",["Tiempo de respuesta","Tasa de defectos","Cobertura de código","Tasa de fallos"],0],
["¿Qué herramienta es adecuada para la gestión de casos de prueba y seguimiento de resultados?",["TestRail","JIRA","Selenium","JMeter"],0],
["¿Qué tipo de prueba se enfoca en probar componentes individuales del software?",["Pruebas unitarias","Pruebas de integración","Pruebas de aceptación","Pruebas de carga"],0],
["¿Qué tipo de prueba se realiza para garantizar que los cambios en el código no han introducido nuevos defectos?",["Pruebas de rendimiento","Pruebas de regresión","Pruebas de seguridad","Pruebas de integración"],1],
["¿Qué métrica se utiliza para medir el número de defectos por línea de código?",["Tasa de defectos","Cobertura de código","Tiempo de respuesta","Tasa de fallos"],0],
["¿Qué técnica se utiliza para probar el software en condiciones extremas de uso?",["Pruebas de aceptación","Pruebas de carga","Pruebas unitarias","Pruebas funcionales"],1],
["¿Qué tipo de pruebas se enfoca en evaluar la interacción del software con bases de datos y otros sistemas externos?",["Pruebas de integración","Pruebas de usabilidad","Pruebas de aceptación","Pruebas de seguridad"],0],
["¿Qué herramienta se utiliza principalmente para la gestión de proyectos y seguimiento de defectos?",["JIRA","Selenium","TestRail","JMeter"],0],
["¿Qué tipo de prueba no se puede automatizar de manera eficiente?",["Pruebas de rendimiento","Pruebas de regresión","Pruebas funcionales","Pruebas de usabilidad"],3],
["¿Qué tipo de prueba es crucial para garantizar que el software funcione correctamente bajo altas cargas de usuarios?",["Pruebas funcionales","Pruebas de rendimiento","Pruebas de seguridad","Pruebas unitarias"],1],
["¿Qué herramienta es utilizada principalmente para inspeccionar la calidad del código y encontrar errores de programación?",["JIRA","Selenium","SonarQube","TestRail"],2],
["¿Qué tipo de pruebas se realizan antes de que el software sea liberado a producción?",["Pruebas de aceptación del usuario (UAT)","Pruebas de regresión","Pruebas unitarias","Pruebas de integración"],0],
["¿Qué métrica es fundamental para evaluar la rapidez con la que se solucionan los defectos encontrados en las pruebas?",["Tiempo de respuesta","Tasa de defectos","Cobertura de código","Tasa de fallos"],0],
["¿Qué tipo de prueba es más adecuada para validar que una nueva funcionalidad no afecta el rendimiento general del sistema?",["Pruebas de usabilidad","Pruebas de regresión","Pruebas unitarias","Pruebas de seguridad"],1],
["¿Qué herramienta se utiliza comúnmente para realizar pruebas de regresión en aplicaciones web?",["JMeter","Selenium","JIRA","TestRail"],1]
];
let game=[],index=0,correct=0,gradedCount=0,currentAnswers=[];const $=id=>document.getElementById(id);const screens=[$('setup'),$('quiz'),$('result')];function show(el){screens.forEach(s=>s.classList.add('hidden'));el.classList.remove('hidden')}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('amount').oninput=()=> $('amountText').textContent=$('amount').value;
$('start').onclick=()=>{game=shuffle([...questions]).slice(0,+$('amount').value);index=0;correct=0;gradedCount=game.filter(q=>q[2]!==null).length;show($('quiz'));render()};
function render(){const q=game[index];$('progressText').textContent=`Pregunta ${index+1} de ${game.length}`;$('progress').style.width=`${index/game.length*100}%`;$('question').textContent=q[0];$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('answers').innerHTML='';currentAnswers=shuffle(q[1].map((text,originalIndex)=>({text,isCorrect:originalIndex===q[2]})));currentAnswers.forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;b.querySelector('span:last-child').textContent=answer.text;b.onclick=()=>choose(i);$('answers').appendChild(b)})}
function choose(choice){const q=game[index],buttons=[...$('answers').children],f=$('feedback'),correctIndex=currentAnswers.findIndex(answer=>answer.isCorrect);buttons.forEach((b,i)=>{b.disabled=true;if(correctIndex>=0&&i===correctIndex)b.classList.add('correct');if(i===choice&&choice!==correctIndex)b.classList.add('wrong')});if(correctIndex<0){f.textContent='Esta pregunta no tiene una opción correcta entre las respuestas proporcionadas y no se contará en la calificación.'}else if(choice===correctIndex){correct++;f.textContent='¡Correcto!';f.classList.add('good')}else f.textContent=`Respuesta correcta: ${currentAnswers[correctIndex].text}`;$('next').textContent=index===game.length-1?'Ver calificación':'Siguiente';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<game.length)render();else finish()};function finish(){const pct=Math.round(correct/gradedCount*100);$('score').textContent=`${pct}/100`;$('scoreDetail').textContent=`Respuestas correctas: ${correct} de ${gradedCount} calificables · Incorrectas: ${gradedCount-correct} · Sin opción correcta: ${game.length-gradedCount}`;$('message').textContent=pct===100?'¡Perfecto! Todas tus respuestas son correctas.':pct>=90?'¡Excelente resultado!':pct>=70?'¡Buen trabajo! Puedes repasar las preguntas que fallaste.':'Sigue practicando: cada intento te ayudará a mejorar.';$('progress').style.width='100%';show($('result'))}$('again').onclick=()=>$('start').click();$('home').onclick=()=>show($('setup'));
</script></body></html>
