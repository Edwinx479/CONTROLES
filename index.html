<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827"><title>Cuestionario: Calidad del Software</title>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#1e293b;--line:#3b4a5e;--text:#f3f6fc;--muted:#bac6d8;--blue:#3b82f6;--green:#22c55e;--red:#ef6464}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#1c2a42 0,#101827 65%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(100%,590px);background:var(--card);border:1px solid #29364a;border-radius:22px;padding:30px;box-shadow:0 20px 55px #0005}.hidden{display:none!important}h1{text-align:center;font-size:clamp(1.65rem,5vw,2.15rem);margin:0 0 12px}h2{font-size:1.45rem;line-height:1.4;margin:20px 0 26px}.intro,.sub{text-align:center;color:var(--muted);font-size:1.1rem;line-height:1.6}.label{display:block;font-weight:650;margin:30px 0 16px}.range{width:100%;accent-color:var(--blue)}.count{font-size:1.25rem;text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px;margin:24px 0}.btn{width:100%;border:0;border-radius:13px;background:var(--blue);color:#071528;padding:16px;font:inherit;font-size:1.12rem;font-weight:650;cursor:pointer}.btn:hover{filter:brightness(1.08)}.meta{color:var(--muted);font-size:1.08rem}.track{height:12px;border-radius:99px;background:#34445c;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:0;background:var(--blue);transition:width .2s}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:15px;padding:13px 16px;font:inherit;font-size:1.08rem;cursor:pointer}.answer:hover:not(:disabled){border-color:#71829a;background:#ffffff08}.letter{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#34445c;font-weight:700}.answer.correct{border-color:#4ade80;background:#14532d;color:#dcfce7}.answer.wrong{border-color:#f87171;background:#7f1d1d;color:#fee2e2}.feedback{min-height:30px;text-align:center;color:#fca5a5;font-weight:650;line-height:1.55;margin:18px 0}.feedback.good{color:#86efac}.result{text-align:center}.score{font-size:3.4rem;font-weight:800;margin:18px 0 4px;color:#93c5fd}.result p{color:var(--muted);font-size:1.1rem}.result-actions{display:grid;gap:12px;margin-top:26px}.secondary{background:#334155;color:var(--text)}@media(max-width:480px){body{padding:16px}.card{padding:22px 18px;border-radius:19px}.answer{font-size:1rem}.letter{width:34px;height:34px}}
</style></head><body>
<main class="card" id="setup"><h1>Cuestionario: Calidad del Software</h1><p class="intro">Practica sobre costos de calidad, prevención, evaluación y fallos del software.</p><label class="label" for="amount">Número de preguntas</label><input class="range" id="amount" type="range" min="1" max="30" value="30"><div class="count" id="amountText">30</div><button class="btn" id="start">Comenzar</button></main>
<main class="card hidden" id="quiz"><div class="meta" id="progressText"></div><div class="track"><div class="fill" id="progress"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn hidden" id="next">Siguiente</button></main>
<main class="card result hidden" id="result"><h1>¡Cuestionario terminado!</h1><div class="score" id="score"></div><p id="scoreDetail"></p><p id="message"></p><div class="result-actions"><button class="btn" id="again">Intentar de nuevo</button><button class="btn secondary" id="home">Cambiar cantidad</button></div></main>
<script>
const questions = [["¿Qué componente es clave para minimizar los costos de fallos externos en el desarrollo de software?",["Capacitación del cliente","Automatización de pruebas","Reducción de requisitos","Implementación acelerada"],1],["¿Cuál es el objetivo principal de los costos de prevención en la gestión de calidad?",["Evitar defectos antes de que ocurran","Detectar errores durante las pruebas","Minimizar costos de producción","Reducir la carga de trabajo del equipo de desarrollo"],0],["¿Cuál de los siguientes NO es un costo asociado a los fallos internos?",["Retrabajo","Soporte técnico post-implementación","Corrección de errores en el código","Demoras en el cronograma"],1],["¿Qué técnica puede ayudar a identificar riesgos antes de que se conviertan en problemas?",["Planificación ágil","Análisis de riesgos temprano","Evaluación de requisitos continuos","Pruebas de aceptación del cliente"],1],["¿Cuál es un ejemplo de costo de evaluación en un proyecto de software?",["Desarrollo de prototipos","Pruebas funcionales","Contratación de personal","Reuniones de inicio"],1],["¿Qué estrategia puede reducir los costos de fallos internos?",["Automatización de pruebas","Uso de tecnologías no probadas","Proyectos a largo plazo","Aumentar la rotación de personal"],0],["¿Qué impacto puede tener una planificación deficiente en la calidad del software?",["Fallos en las pruebas y demoras","Mayor eficiencia operativa","Reducción en la carga de trabajo","Mejor experiencia del cliente"],0],["¿Cuál de los siguientes costos está relacionado con la falta de pruebas exhaustivas?",["Capacitación adicional","Correcciones post-producción","Auditorías de calidad","Mejora continua"],1],["¿Qué riesgo está asociado al uso de tecnologías nuevas sin experiencia en el equipo?",["Mayor probabilidad de fallos técnicos","Menores costos de producción","Reducción en el tiempo de desarrollo","Aumento en la capacidad operativa"],0],["¿Qué estrategia de pruebas puede ayudar a reducir el riesgo de defectos no detectados?",["Pruebas automatizadas","Reducción de revisiones de código","Incremento en el uso de nuevos lenguajes","Eliminación de pruebas de estrés"],0],["¿Qué tipo de costos se asocian con fallos que llegan al cliente final?",["Costos de fallos externos","Costos de evaluación","Costos de prevención","Costos de corrección de código"],0],["¿Qué componente es clave en los costos de prevención para mejorar la calidad del software?",["Capacitación continua del equipo","Eliminación de revisiones de código","Reducción de pruebas automatizadas","Implementación sin evaluación"],0],["¿Qué métrica ayuda a evaluar el éxito en la gestión de calidad durante un proyecto?",["Tasa de defectos","Costos de producción","Reducción del tiempo de pruebas","Incremento en el tamaño del equipo"],0],["¿Qué riesgo puede surgir de la falta de un plan de pruebas bien definido?",["Mayor flexibilidad en los plazos","Defectos no detectados que llegan al cliente","Reducción en los costos de desarrollo","Menor número de revisiones de código"],1],["¿Qué herramienta ayuda a reducir los costos de evaluación durante el desarrollo de software?",["Pruebas automatizadas","Planificación acelerada","Aumento de la carga de trabajo manual","Reducción de la capacitación técnica"],0],["¿Cuál de los siguientes factores NO contribuye a los costos de fallos externos?",["Soporte técnico adicional","Retrabajo post-producción","Automatización de pruebas funcionales","Pérdida de reputación"],2],["¿Qué tipo de riesgo está asociado a la falta de claridad en los requisitos del proyecto?",["Cambios frecuentes durante el desarrollo","Reducción de tiempos de prueba","Menores costos de implementación","Aumento de la satisfacción del cliente"],0],["¿Qué costo puede reducirse significativamente mediante una estrategia de pruebas proactiva?",["Costos de fallos externos","Costos de planificación","Incremento en la cantidad de pruebas manuales","Mayor rotación del equipo"],0],["¿Qué técnica de mitigación es clave para reducir los riesgos asociados a nuevas tecnologías?",["Capacitación continua del equipo","Uso exclusivo de pruebas manuales","Implementación sin evaluación previa","Reducción de requisitos"],0],["¿Qué impacto tiene la falta de capacitación en un equipo de desarrollo sobre la calidad del software?",["Mayor probabilidad de errores","Aumento en la eficiencia","Reducción de costos de evaluación","Reducción en los tiempos de desarrollo"],0],["¿Qué estrategia es fundamental para identificar defectos tempranos en el ciclo de vida del desarrollo?",["Pruebas de integración temprana","Eliminación de pruebas de estrés","Uso de nuevas tecnologías","Reducción en el equipo de desarrollo"],0],["¿Qué métrica se utiliza para evaluar la eficacia de las pruebas automatizadas?",["Cobertura de pruebas","Costos de fallos internos","Número de desarrolladores","Tiempos de respuesta"],0],["¿Qué tipo de prueba es más eficiente para mitigar riesgos relacionados con el rendimiento del software?",["Pruebas unitarias","Pruebas de estrés y rendimiento","Pruebas de usabilidad","Pruebas de aceptación"],1],["¿Qué factor es clave para reducir los costos de corrección de errores durante el desarrollo?",["Automatización temprana de pruebas","Reducción del equipo de desarrollo","Eliminar revisiones de código","Aumento en los tiempos de prueba"],0],["¿Qué costo se puede reducir significativamente mediante la identificación temprana de defectos?",["Costos de fallos internos","Costos de planificación","Costos de capacitación","Costos de auditoría"],0],["¿Qué estrategia puede ayudar a mitigar los riesgos asociados a los requisitos poco claros?",["Revisión continua de requisitos","Reducción de revisiones","Aumento en la automatización","Pruebas de estrés"],0],["¿Qué impacto puede tener la falta de automatización en los costos del proyecto?",["Reducción de costos a largo plazo","Aumento de costos de fallos internos y externos","Mayor satisfacción del cliente","Reducción de defectos"],1],["¿Qué técnica de prevención puede ayudar a reducir los riesgos tecnológicos en un proyecto?",["Evaluación de nuevas tecnologías antes de implementarlas","Pruebas únicamente funcionales","Eliminación de pruebas de regresión","Reducción del tamaño del equipo"],0],["¿Qué riesgo puede surgir de la falta de pruebas exhaustivas en el ciclo de vida del software?",["Reducción en los costos de producción","Mayor probabilidad de fallos externos","Menor tiempo de entrega","Aumento en la flexibilidad del cronograma"],1],["¿Qué estrategia puede reducir el impacto de los fallos en la fase post- implementación?",["Reducción en la cantidad de pruebas","Automatización de pruebas de regresión y aceptación","Incremento en la carga de trabajo manual","Eliminación de pruebas de integración"],1]];
let game=[],index=0,correct=0,gradedCount=0,currentAnswers=[];const $=id=>document.getElementById(id);const screens=[$('setup'),$('quiz'),$('result')];function show(el){screens.forEach(s=>s.classList.add('hidden'));el.classList.remove('hidden')}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('amount').oninput=()=> $('amountText').textContent=$('amount').value;
$('start').onclick=()=>{game=shuffle([...questions]).slice(0,+$('amount').value);index=0;correct=0;gradedCount=game.filter(q=>q[2]!==null).length;show($('quiz'));render()};
function render(){const q=game[index];$('progressText').textContent=`Pregunta ${index+1} de ${game.length}`;$('progress').style.width=`${index/game.length*100}%`;$('question').textContent=q[0];$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('answers').innerHTML='';currentAnswers=shuffle(q[1].map((text,originalIndex)=>({text,isCorrect:originalIndex===q[2]})));currentAnswers.forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;b.querySelector('span:last-child').textContent=answer.text;b.onclick=()=>choose(i);$('answers').appendChild(b)})}
function choose(choice){const q=game[index],buttons=[...$('answers').children],f=$('feedback'),correctIndex=currentAnswers.findIndex(answer=>answer.isCorrect);buttons.forEach((b,i)=>{b.disabled=true;if(correctIndex>=0&&i===correctIndex)b.classList.add('correct');if(i===choice&&choice!==correctIndex)b.classList.add('wrong')});if(correctIndex<0){f.textContent='Esta pregunta no tiene una opción correcta entre las respuestas proporcionadas y no se contará en la calificación.'}else if(choice===correctIndex){correct++;f.textContent='¡Correcto!';f.classList.add('good')}else f.textContent=`Respuesta correcta: ${currentAnswers[correctIndex].text}`;$('next').textContent=index===game.length-1?'Ver calificación':'Siguiente';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<game.length)render();else finish()};function finish(){const pct=Math.round(correct/gradedCount*100);$('score').textContent=`${pct}/100`;$('scoreDetail').textContent=`Respuestas correctas: ${correct} de ${gradedCount} calificables · Incorrectas: ${gradedCount-correct} · Sin opción correcta: ${game.length-gradedCount}`;$('message').textContent=pct===100?'¡Perfecto! Todas tus respuestas son correctas.':pct>=90?'¡Excelente resultado!':pct>=70?'¡Buen trabajo! Puedes repasar las preguntas que fallaste.':'Sigue practicando: cada intento te ayudará a mejorar.';$('progress').style.width='100%';show($('result'))}$('again').onclick=()=>$('start').click();$('home').onclick=()=>show($('setup'));
</script></body></html>
