<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827"><title>Cuestionario: Calidad del Software</title>
<style>
:root{color-scheme:dark;--bg:#101827;--card:#1e293b;--line:#3b4a5e;--text:#f3f6fc;--muted:#bac6d8;--blue:#3b82f6;--green:#22c55e;--red:#ef6464}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#1c2a42 0,#101827 65%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{width:min(100%,590px);background:var(--card);border:1px solid #29364a;border-radius:22px;padding:30px;box-shadow:0 20px 55px #0005}.hidden{display:none!important}h1{text-align:center;font-size:clamp(1.65rem,5vw,2.15rem);margin:0 0 12px}h2{font-size:1.45rem;line-height:1.4;margin:20px 0 26px}.intro,.sub{text-align:center;color:var(--muted);font-size:1.1rem;line-height:1.6}.label{display:block;font-weight:650;margin:30px 0 16px}.range{width:100%;accent-color:var(--blue)}.count{font-size:1.25rem;text-align:center;border:2px solid var(--line);border-radius:12px;padding:12px;margin:24px 0}.btn{width:100%;border:0;border-radius:13px;background:var(--blue);color:#071528;padding:16px;font:inherit;font-size:1.12rem;font-weight:650;cursor:pointer}.btn:hover{filter:brightness(1.08)}.meta{color:var(--muted);font-size:1.08rem}.track{height:12px;border-radius:99px;background:#34445c;overflow:hidden;margin:12px 0 22px}.fill{height:100%;width:0;background:var(--blue);transition:width .2s}.answers{display:grid;gap:12px}.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:15px;padding:13px 16px;font:inherit;font-size:1.08rem;cursor:pointer}.answer:hover:not(:disabled){border-color:#71829a;background:#ffffff08}.letter{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#34445c;font-weight:700}.answer.correct{border-color:#4ade80;background:#14532d;color:#dcfce7}.answer.wrong{border-color:#f87171;background:#7f1d1d;color:#fee2e2}.feedback{min-height:30px;text-align:center;color:#fca5a5;font-weight:650;line-height:1.55;margin:18px 0}.feedback.good{color:#86efac}.result{text-align:center}.score{font-size:3.4rem;font-weight:800;margin:18px 0 4px;color:#93c5fd}.result p{color:var(--muted);font-size:1.1rem}.result-actions{display:grid;gap:12px;margin-top:26px}.secondary{background:#334155;color:var(--text)}@media(max-width:480px){body{padding:16px}.card{padding:22px 18px;border-radius:19px}.answer{font-size:1rem}.letter{width:34px;height:34px}}
</style></head><body>
<main class="card" id="setup"><h1>Cuestionario: Calidad del Software</h1><p class="intro">Practica sobre ISO, SPICE, CMMI y calidad de software.</p><label class="label" for="amount">Número de preguntas</label><input class="range" id="amount" type="range" min="1" max="30" value="30"><div class="count" id="amountText">30</div><button class="btn" id="start">Comenzar</button></main>
<main class="card hidden" id="quiz"><div class="meta" id="progressText"></div><div class="track"><div class="fill" id="progress"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn hidden" id="next">Siguiente</button></main>
<main class="card result hidden" id="result"><h1>¡Cuestionario terminado!</h1><div class="score" id="score"></div><p id="scoreDetail"></p><p id="message"></p><div class="result-actions"><button class="btn" id="again">Intentar de nuevo</button><button class="btn secondary" id="home">Cambiar cantidad</button></div></main>
<script>
const questions=[
["¿Cuál es el propósito principal de la norma ISO/IEC 25010 en el desarrollo de software?",["Reducir costos de desarrollo","Evaluar la calidad del software basado en características clave","Facilitar la migración entre plataformas","Definir métricas de rendimiento"],1],
["¿Qué define el estándar ISO/IEC 12207?",["Los procesos del ciclo de vida del software","Modelos de arquitectura de software","Directrices para pruebas","Gestión de la configuración del código"],0],
["¿Cuál es una característica de calidad en el modelo ISO/IEC 25010?",["Escalabilidad","Mantenibilidad","Complejidad","Integración"],1],
["¿Qué proceso se incluye entre los procesos de soporte según ISO/IEC 12207?",["Desarrollo de requisitos","Verificación","Implementación","Gestión de versiones"],1],
["¿Qué característica se refiere a la capacidad del software para resistir ataques y proteger la información?",["Fiabilidad","Seguridad","Compatibilidad","Eficiencia del rendimiento"],1],
["¿Cuál es el nivel más bajo en la escala de capacidad de procesos del modelo SPICE?",["Gestionado","Incompleto","Establecido","Predecible"],1],
["¿Qué estándar está enfocado en la evaluación y mejora de procesos de desarrollo de software?",["SPICE","ISO 9001","IEEE 730","ISO/IEC 25010"],0],
["¿Cuál es el objetivo principal de CMMI en los procesos de software?",["Certificar productos de software","Mejorar continuamente los procesos de desarrollo","Reducir el tiempo de desarrollo","Asegurar la portabilidad"],1],
["¿Qué se evalúa en la característica de portabilidad según ISO/IEC 25010?",["La capacidad de transferir el software a diferentes entornos","La capacidad de integrar nuevas funciones","La eficiencia en el uso de recursos","La escalabilidad del sistema"],0],
["¿Qué característica de calidad se relaciona con la facilidad para modificar el software?",["Fiabilidad","Mantenibilidad","Eficiencia","Compatibilidad"],1],
["¿Qué nivel de CMMI se caracteriza por usar métricas cuantitativas para gestionar procesos?",["Nivel 3: Definido","Nivel 4: Gestionado cuantitativamente","Nivel 2: Gestionado","Nivel 5: Optimizado"],1],
["¿Qué norma internacional establece un sistema de gestión de calidad aplicable también a proyectos de software?",["ISO/IEC 25010","ISO 9001","IEEE 12207","SPICE"],1],
["¿Qué subcaracterística forma parte de la mantenibilidad según ISO/IEC 25010?",["Eficiencia","Capacidad de modificación","Seguridad","Compatibilidad"],1],
["¿Qué es el aseguramiento de la calidad del software (SQA)?",["Un proceso de prueba del software","Actividades para asegurar que el software y sus procesos cumplen los requisitos y estándares de calidad","Una herramienta de gestión de proyectos","Un estándar de certificación"],1],
["¿Qué nivel de madurez de CMMI se enfoca en la mejora continua de los procesos?",["Nivel 1: Inicial","Nivel 2: Gestionado","Nivel 3: Definido","Nivel 5: Optimizado"],3],
["¿Qué modelo ofrece un marco para especificar y medir características de calidad del software?",["ISO/IEC 25010","IEEE 730","CMMI","ISO/IEC 12207"],0],
["¿Cuál es una ventaja principal de seguir los procesos definidos por ISO/IEC 12207?",["Estandariza las actividades del ciclo de vida del software","Reduce automáticamente el costo","Acelera la implementación","Facilita la migración"],0],
["¿Qué tipo de pruebas comprueba que el software funcione correctamente en diferentes entornos?",["Pruebas unitarias","Pruebas de compatibilidad","Pruebas de rendimiento","Pruebas de integración"],1],
["¿Qué describe mejor la fiabilidad según ISO/IEC 25010?",["La capacidad de mantener el rendimiento y funcionar correctamente bajo condiciones especificadas","La facilidad de uso","La cantidad de recursos consumidos","El tiempo de respuesta"],0],
["¿Cuál de los siguientes no es un nivel de madurez de CMMI?",["Gestionado","Definido","Certificado","Optimizado"],2],
["¿Cuál es el propósito principal de SPICE?",["Evaluar la capacidad de los procesos de desarrollo de software","Certificar la seguridad del software","Asegurar la portabilidad","Facilitar la implementación de pruebas"],0],
["¿Qué modelo se utiliza para evaluar y mejorar la madurez de los procesos de desarrollo de software?",["CMMI","ISO 9001","ISO/IEC 12207","ISO/IEC 25010"],0],
["¿Qué característica es crítica para que el software pueda operar en múltiples plataformas?",["Eficiencia del rendimiento","Portabilidad","Mantenibilidad","Seguridad"],1],
["¿Qué aspecto mide la usabilidad según ISO/IEC 25010?",["La facilidad de uso para los usuarios previstos","La adaptación a nuevos entornos","La velocidad de respuesta","La facilidad para modificar el software"],0],
["¿Qué tipo de pruebas se realizan para comprobar que el software cumple requisitos de seguridad?",["Pruebas de carga","Pruebas funcionales","Pruebas de seguridad","Pruebas de aceptación"],2],
["¿Qué nivel de CMMI se centra en estandarizar los procesos en toda la organización?",["Nivel 1: Inicial","Nivel 2: Gestionado","Nivel 3: Definido","Nivel 5: Optimizado"],2],
["¿Qué característica de calidad se relaciona con la facilidad para modificar y actualizar el software?",["Mantenibilidad","Seguridad","Portabilidad","Compatibilidad"],0],
["¿Qué estándar define procesos del ciclo de vida que incluyen actividades de gestión de riesgos?",["CMMI","ISO/IEC 25010","ISO/IEC 12207","SPICE"],2],
["¿Qué función tiene la auditoría en el aseguramiento de la calidad del software?",["Verificar únicamente el código fuente","Evaluar si los procesos cumplen los estándares y requisitos de calidad","Corregir errores del software","Gestionar la configuración"],1],
["¿Qué técnica se utiliza para medir la complejidad del flujo de control de un programa?",["Complejidad ciclomática","Tiempo de respuesta","Carga de CPU","Número de líneas de código"],0]
];
let game=[],index=0,correct=0;const $=id=>document.getElementById(id);const screens=[$('setup'),$('quiz'),$('result')];function show(el){screens.forEach(s=>s.classList.add('hidden'));el.classList.remove('hidden')}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('amount').oninput=()=> $('amountText').textContent=$('amount').value;
$('start').onclick=()=>{game=shuffle([...questions]).slice(0,+$('amount').value);index=0;correct=0;show($('quiz'));render()};
function render(){const q=game[index];$('progressText').textContent=`Pregunta ${index+1} de ${game.length}`;$('progress').style.width=`${index/game.length*100}%`;$('question').textContent=q[0];$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('answers').innerHTML='';q[1].forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;b.querySelector('span:last-child').textContent=a;b.onclick=()=>choose(i);$('answers').appendChild(b)})}
function choose(choice){const q=game[index],buttons=[...$('answers').children],f=$('feedback');buttons.forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add('correct');if(i===choice&&choice!==q[2])b.classList.add('wrong')});if(choice===q[2]){correct++;f.textContent='¡Correcto!';f.classList.add('good')}else f.textContent=`Respuesta correcta: ${q[1][q[2]]}`;$('next').textContent=index===game.length-1?'Ver calificación':'Siguiente';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index<game.length)render();else finish()};function finish(){const pct=Math.round(correct/game.length*100);$('score').textContent=`${pct}/100`;$('scoreDetail').textContent=`Respuestas correctas: ${correct} de ${game.length} · Incorrectas: ${game.length-correct}`;$('message').textContent=pct===100?'¡Perfecto! Todas tus respuestas son correctas.':pct>=90?'¡Excelente resultado!':pct>=70?'¡Buen trabajo! Puedes repasar las preguntas que fallaste.':'Sigue practicando: cada intento te ayudará a mejorar.';$('progress').style.width='100%';show($('result'))}$('again').onclick=()=>$('start').click();$('home').onclick=()=>show($('setup'));
</script></body></html>
